<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI — Vice City Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #050711;
    --neon-pink: #ff2a85;
    --neon-purple: #8a2be2;
    --neon-cyan: #00f2fe;
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    /* Keep the main body from scrolling, let the screens scroll instead */
    overflow: hidden; 
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-dark);
    color: #fff;
  }

  .app-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 20%, rgba(138, 43, 226, 0.25) 0%, rgba(5, 7, 17, 0.95) 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(255, 42, 133, 0.18) 0%, transparent 50%);
    overflow: hidden;
  }

  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }

  /* Modified Screen Views for scrolling */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start; /* Allows natural scrolling */
    padding: 100px 20px 60px; /* Extra top padding to clear the absolute back button */
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.96) translateY(10px);
    filter: blur(8px);
    overflow-y: auto; /* Enable scrolling for extra cards */
    overflow-x: hidden;
  }

  .screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1) translateY(0);
    filter: blur(0px);
  }

  #screen-home {
    justify-content: center; /* Keep home screen perfectly centered */
    padding-top: 40px;
  }

  .title-wrap {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
  }

  .title-gta {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(52px, 10vw, 110px);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #ffffff 20%, var(--neon-pink) 60%, var(--neon-cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 50px rgba(255, 42, 133, 0.3);
    line-height: 1;
  }

  .subtitle {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 6px;
    font-size: clamp(10px, 1.5vw, 14px);
    color: rgba(255, 255, 255, 0.6);
    text-transform: uppercase;
    margin-top: 10px;
  }

  .nav-group {
    display: flex;
    gap: 20px;
    z-index: 5;
  }

  .btn {
    position: relative;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    border: 1px solid var(--glass-border);
    padding: 16px 42px;
    border-radius: 100px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(255, 255, 255, 0.3);
  }

  .btn:hover::before { opacity: 1; }

  .btn-purple { background: linear-gradient(135deg, rgba(255, 42, 133, 0.4), rgba(138, 43, 226, 0.4)); }
  .btn-purple:hover { box-shadow: 0 15px 35px rgba(255, 42, 133, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4); }

  .btn-cyan { background: linear-gradient(135deg, rgba(0, 242, 254, 0.3), rgba(79, 172, 254, 0.3)); }
  .btn-cyan:hover { box-shadow: 0 15px 35px rgba(0, 242, 254, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4); }

  .modern-back-btn {
    position: absolute;
    top: 36px;
    left: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px 10px 12px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    z-index: 10;
  }

  .modern-back-btn .icon-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease, background 0.3s ease;
  }

  .modern-back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s ease; }
  .modern-back-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateX(-3px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.1); }
  .modern-back-btn:hover .icon-circle { background: var(--neon-cyan); color: #000; }
  .modern-back-btn:hover svg { transform: translateX(-2px); }

  .screen-badge {
    position: absolute;
    top: 36px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 10px 28px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    text-transform: uppercase;
  }

  /* Cards Modified for Responsiveness */
  .cards-container {
    display: flex;
    gap: 35px;
    margin-top: 30px;
    width: 100%;
    max-width: 900px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .media-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--glass-border);
    padding: 20px;
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    width: 100%;
    max-width: 340px; /* Prevents cards from getting too large on desktop */
  }

  .media-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255, 255, 255, 0.25);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(0, 242, 254, 0.15);
  }

  .preview-box {
    width: 100%; /* Stretches to fill the max-width of media-card */
    aspect-ratio: 16 / 10;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 40px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .preview-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
  .media-card:hover .preview-box img { transform: scale(1.08); }

  .logo-vi {
    width: clamp(100px, 18vw, 160px);
    margin-top: 40px;
    opacity: 0.85;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
  }

  /* Responsive Media Queries */
  @media (max-width: 768px) {
    /* Stack navigation buttons on mobile */
    .nav-group {
      flex-direction: column;
      width: 100%;
      max-width: 280px;
    }
    .btn {
      width: 100%;
    }
    
    /* Adjust top header spacing so back button and badge don't overlap */
    .screen {
      padding-top: 80px;
    }
    .modern-back-btn {
      top: 20px;
      left: 20px;
      padding: 8px 16px 8px 10px;
      font-size: 11px;
    }
    /* Let the badge flow in the document instead of absolute positioning on small screens */
    .screen-badge {
      position: static;
      margin-bottom: 20px;
      font-size: 12px;
      padding: 8px 20px;
    }
    .cards-container {
      margin-top: 10px;
      gap: 20px;
    }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="grid-overlay"></div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="title-wrap">
      <h1 class="title-gta">GTA VI</h1>
      <p class="subtitle">Vice City Raf Leaks Hub Form the best cyberleek</p>
    </div>
    <div class="nav-group">
      <button class="btn btn-purple" onclick="navTo('video')">
        <span>VIDEO</span>
      </button>
      <button class="btn btn-cyan" onclick="navTo('pic')">
        <span>PIC</span>
      </button>
    </div>
    
    <svg class="logo-vi" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 10 L30 10 L45 70 L30 70 Z" fill="url(#pink-grad)"/>
      <path d="M40 10 L60 10 L45 70 L30 70 Z" fill="url(#purp-grad)"/>
      <path d="M65 10 L85 10 L85 70 L65 70 Z" fill="url(#cyan-grad)"/>
      <defs>
        <linearGradient id="pink-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff2a85"/><stop offset="100%" stop-color="#ff758c"/></linearGradient>
        <linearGradient id="purp-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a2be2"/><stop offset="100%" stop-color="#4a00e0"/></linearGradient>
        <linearGradient id="cyan-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient>
      </defs>
    </svg>
  </div>

  <!-- VIDEO SCREEN -->
  <div class="screen" id="screen-video">
    <button class="modern-back-btn" onclick="navTo('home')">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <span>RETOUR</span>
    </button>
    
    <div class="screen-badge" style="color: var(--neon-pink); border-color: rgba(255, 42, 133, 0.3);">VIDÉOS</div>
    
    <div class="cards-container">
      <div class="media-card">
        <div class="preview-box">🎬</div>
        <a class="btn btn-purple" href="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" download="GTA6_Trailer_1.mp4">
          <span>TÉLÉCHARGER</span>
        </a>
      </div>
      <div class="media-card">
        <div class="preview-box">🎥</div>
        <a class="btn btn-purple" href="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" download="GTA6_Teaser_2.mp4">
          <span>TÉLÉCHARGER</span>
        </a>
      </div>
    </div>
  </div>

  <!-- PIC SCREEN -->
  <div class="screen" id="screen-pic">
    <button class="modern-back-btn" onclick="navTo('home')">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </div>
      <span>RETOUR</span>
    </button>
    
    <div class="screen-badge" style="color: var(--neon-cyan); border-color: rgba(0, 242, 254, 0.3);">PHOTOS</div>
    
    <div class="cards-container">
      <div class="media-card">
        <div class="preview-box">
          <img src="https://gmrqkwlcmrfohkelmmpijhktbqw2isfzh5hqyjphwwot33s4pbua.arweave.net/MyMFWWJkSuOoi2MehJ1TDC2kSLk_Twwl57WdPe5ceGg" alt="Artwork 1">
        </div>
        <a class="btn btn-cyan" href="https://gmrqkwlcmrfohkelmmpijhktbqw2isfzh5hqyjphwwot33s4pbua.arweave.net/MyMFWWJkSuOoi2MehJ1TDC2kSLk_Twwl57WdPe5ceGg" download="GTA6_Artwork_1.jpg" target="_blank">
          <span>TÉLÉCHARGER</span>
        </a>
      </div>
      <div class="media-card">
        <div class="preview-box">
          <img src="https://zw34jrqe4k3l5c3h2cxpew7xh7eggdv6pk4yzbbblemfgu45m7wq.arweave.net/zbfExgTitr6LZ9Cu8lv3P8hjDr56uYyEIVkYU1OdZ-0" alt="Artwork 2">
        </div>
        <a class="btn btn-cyan" href="https://zw34jrqe4k3l5c3h2cxpew7xh7eggdv6pk4yzbbblemfgu45m7wq.arweave.net/zbfExgTitr6LZ9Cu8lv3P8hjDr56uYyEIVkYU1OdZ-0" download="GTA6_Artwork_2.jpg" target="_blank">
          <span>TÉLÉCHARGER</span>
        </a>
      </div>
      <div class="media-card">
        <div class="preview-box">
          <img  alt="all map">
        </div>
        <a class="btn btn-cyan" href="https://dfknmjkg4dn3ls5qkeghfukuf6hftxnxrdedlhzk5bjxw5fj74gq.vilenarios.com/GVTWJUbg27XLsFEMctFUL45Z3beIyDWfKuhTe3Sp_w0" download="GTA6_Artwork_3.jpg" target="_blank">
          <span>TÉLÉCHARGER</span>
        </a>
      </div>
    </div>
  </div>

</div>

<script>
  function navTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screenId).classList.add('active');
  }
</script>

</body>
</html>
